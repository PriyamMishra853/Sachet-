name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # --frozen-lockfile fails if pnpm-lock.yaml is out of date, so CI
      # installs exactly what you tested locally.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @sachet/web build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # The API image exactly as Railway builds it, started the same way, and
  # checked to answer /health. Catches a broken Dockerfile before a deploy does.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/api/Dockerfile -t sachet-api .
      - name: Start the image and check /health
        run: |
          docker run -d --name api -p 3000:3000 \
            -e NODE_ENV=production -e HASH_SALT=ci-only-salt-not-secret-0123456789 sachet-api
          for i in $(seq 1 30); do
            if curl -fsS localhost:3000/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

  # The Android app: unit tests, Android lint, and a debug APK you can
  # download from the run's Artifacts. GitHub's Ubuntu runners have the
  # Android SDK installed.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle downloads between runs and checks the wrapper jar is genuine.
      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sachet-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
