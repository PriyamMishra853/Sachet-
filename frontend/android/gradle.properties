org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Where the app finds the Sachet API.
# Debug: the laptop as the Android emulator sees it. On a real phone over USB,
# run `adb reverse tcp:3000 tcp:3000` and use http://localhost:3000.
sachet.apiUrl.debug=http://10.0.2.2:3000
# Release: your Railway URL. Must be https.
sachet.apiUrl.release=https://CHANGE-ME.up.railway.app
